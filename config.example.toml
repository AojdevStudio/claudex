[proxy]
base_url = "https://gateway.example.com"
api_key_file = "~/.config/claudex/api-key"

[defaults]
model = "fable"

[models]
fable = "provider-fable-model"
opus = "provider-opus-model"
sonnet = "provider-sonnet-model"
haiku = "provider-haiku-model"

# Exact token limits keyed by the raw model IDs above. Claudex exports the
# selected value as CLAUDE_CODE_MAX_CONTEXT_TOKENS for every launch.
[context_windows]
"provider-fable-model" = 1000000
"provider-opus-model" = 1000000
"provider-sonnet-model" = 200000
"provider-haiku-model" = 200000
"provider-custom-model" = 500000

[custom_model]
id = "provider-custom-model"
name = "Custom gateway model"
description = "Optional custom picker entry routed through the gateway"

[claude]
subagent_model = "inherit"
always_enable_effort = true
max_tool_use_concurrency = 3
enable_tool_search = false
