name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-tests:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-build-tools.sh musl-tools
      - if: runner.os == 'macOS'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings
      - run: cargo test --all-targets --target "${{ matrix.target }}"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

  test:
    name: test
    if: ${{ always() }}
    needs: platform-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform test
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: test "$PLATFORM_RESULT" = success
