name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-build-tools.sh musl-tools xz-utils
      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${RELEASE_TAG}" = "v${version}"
      - name: Build archive and checksum
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          artifact="claudex-v${version}-${TARGET}"
          cargo build --locked --release --target "${TARGET}"
          mkdir -p "dist/${artifact}"
          cp "target/${TARGET}/release/claudex" "dist/${artifact}/claudex"
          cp README.md LICENSE SECURITY.md "dist/${artifact}/"
          tar -C dist -cJf "dist/${artifact}.tar.xz" "${artifact}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${artifact}.tar.xz" > "${artifact}.tar.xz.sha256")
          else
            (cd dist && shasum -a 256 "${artifact}.tar.xz" > "${artifact}.tar.xz.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: claudex-release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.tar.xz.sha256
          if-no-files-found: error

  attest-and-release:
    needs: build
    runs-on: macos-14
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: claudex-release-assets-*
          path: dist
          merge-multiple: true
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.xz
      - name: Verify release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*.tar.xz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.xz dist/*.tar.xz.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
