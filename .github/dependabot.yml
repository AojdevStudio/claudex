version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These action tags select Rust itself and must match rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
