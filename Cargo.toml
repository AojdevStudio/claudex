[package]
name = "claudex"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Launch Claude Code through an OpenAI-compatible model gateway"
license = "MIT"
repository = "https://github.com/AojdevStudio/claudex"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
